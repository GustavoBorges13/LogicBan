name: Build All Installers

on:
  workflow_dispatch: # Acionamento manual
  push:
    branches:
      - main # Executa quando há um push para o branch main
  pull_request:
    branches:
      - main # Executa quando há um pull request para o branch main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # Removemos macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download Wix (Windows)
        uses: i3h/download-release-asset@v1
        if: matrix.os == 'windows-latest'
        with:
          owner: wixtoolset
          repo: wix3
          tag: wix3112rtm
          file: wix311-binaries.zip

      - name: Decompress Wix (Windows)
        uses: DuckSoft/extract-7z-action@v1.0
        if: matrix.os == 'windows-latest'
        with:
          pathSource: wix311-binaries.zip
          pathTarget: ./target/wix

      - name: Add Wix to Path (Windows)
        run: echo "$HOME/target/wix" >> $GITHUB_PATH
        if: matrix.os == 'windows-latest'

      - uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17
          distribution: 'temurin' # Usando Temurin (OpenJDK)
          cache: 'maven'

      - name: "Build with Maven"
        run: mvn -B clean install --file pom.xml

      - name: "Package with jpackage (Windows)"
        if: matrix.os == 'windows-latest'
        run: |
          jpackage --type msi \
                   --input target \
                   --main-jar logicban-1.0.0.jar \
                   --main-class br.ufcat.logicban.ui.Main \
                   --dest target/jpackage \
                   --app-version 1.0.0 \
                   --name LogicBan \
                   --vendor "Bug Hunters" \
                   --copyright "Copyright (C) 2025" \
                   --win-menu \
                   --win-shortcut

      - name: "Package with jpackage (Linux)"
        if: matrix.os == 'ubuntu-latest'
        run: |
          jpackage --type deb \
                   --input target \
                   --main-jar logicban-1.0.0.jar \
                   --main-class br.ufcat.logicban.ui.Main \
                   --dest target/jpackage \
                   --app-version 1.0.0 \
                   --name LogicBan \
                   --vendor "Bug Hunters" \
                   --copyright "Copyright (C) 2025" \
                   --icon src/resources/assets/logos/icone.png

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logicban-${{ matrix.os }}
          path: |
            target/jpackage/*.msi
            target/jpackage/*.deb