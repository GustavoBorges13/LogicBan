name: Build and Package

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Necessário para obter o histórico completo para tags

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn package

      - name: Print version
        shell: pwsh
        run: |
          echo "Version: $version"
      - name: Verify version properties dir
        run: |
              dir target/classes/
      - name: Read version from version.properties
        id: get_version
        run: |
          VERSION=$(grep "version=" ./target/classes/version.properties | cut -d '=' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package with jpackage (Windows)
        shell: pwsh
        run: |
          jpackage --type exe `
                   --input target `
                   --main-jar "LogicBan-${VERSION}-jar-with-dependencies.jar" `
                   --main-class br.ufcat.logicban.ui.Main `
                   --dest target/jpackage `
                   --app-version ${VERSION} `
                   --name LogicBan `
                   --vendor "Bug Hunters" `
                   --copyright "Copyright (C) 2025" `
                   --icon src/resources/assets/logos/icone.ico `
                   --win-menu `
                   --win-per-user-install `
                   --win-help-url "https://github.com/GustavoBorges13/LogicBan/wiki/Tutorial-%E2%80%90-Como-jogar" `
                   --win-update-url "https://github.com/GustavoBorges13/LogicBan/releases/latest"
      
      - name: Verify Windows artifact
        shell: pwsh
        run: |
            dir target/jpackage/
        
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-windows
          path: target/jpackage/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Necessário para obter o histórico completo para tags

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn package
      - name: verify actual version properties dir
        run: |
              ls -lh ./target/classes/

     
      - name: Print version
        run: |
          cat ./target/classes/version.properties
  
      - name: Read version from version.properties
        id: get_version
        run: |
          VERSION=$(sed -n 's/version=//p' ./target/classes/version.properties)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
            
      - name: Print version
        run: |
            echo (grep "version=" ./target/classes/version.properties | cut -d '=' -f 2)
      - name: Package with jpackage (Linux)
        run: |
          jpackage --type deb \
             --input target \
             --main-jar "LogicBan-$version-jar-with-dependencies.jar" \
             --main-class br.ufcat.logicban.ui.Main \
             --dest ./jpackage-output \
             --app-version "$version" \
             --name LogicBan \
             --vendor "Bug Hunters" \
             --copyright "Copyright (C) 2025" \
             --icon src/resources/assets/logos/icone.png 

      - name: Clean up dependencies in control file
        run: |
          # Extraindo o conteúdo do pacote .deb
          dpkg-deb -x ./jpackage-output/logicban_$version_amd64.deb /tmp/logicban
          dpkg-deb -e ./jpackage-output/logicban_$version_amd64.deb /tmp/logicban/DEBIAN
          # Removendo as dependências desnecessárias do arquivo control
          sed -i '/libasound2t64/d' /tmp/logicban/DEBIAN/control
          sed -i '/libmd0/d' /tmp/logicban/DEBIAN/control
          sed -i '/libx11-6/d' /tmp/logicban/DEBIAN/control
          # Removendo o campo "Depends" se não for necessário
          sed -i '/^Depends:/d' /tmp/logicban/DEBIAN/control
          # Recriar o pacote .deb com o arquivo control modificado
          dpkg-deb -b /tmp/logicban ./jpackage-output/logicban_$version_amd64.deb
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-linux-deb
          path: ./jpackage-output/*.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Necessário para obter o histórico completo para tags

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn package
      - name: verify actual version properties dir
        run: |
              ls -lh ./target/classes/
      - name: Read version from version.properties
        id: get_version
        run: |
          VERSION=$(grep "version=" "$GITHUB_WORKSPACE/artifacts/target/classes/version.properties" | cut -d '=' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package with jpackage (macOS)
        run: |
          jpackage --type dmg \
             --input target \
             --main-jar "LogicBan-${VERSION}-jar-with-dependencies.jar" \
             --main-class br.ufcat.logicban.ui.Main \
             --dest target/jpackage \
             --app-version "${VERSION}" \
             --name LogicBan \
             --vendor "Bug Hunters" \
             --copyright "Copyright (C) 2025" \
             --icon src/resources/assets/logos/icone.ico
    
      - name: List jpackage Output
        run: ls -lh target/jpackage/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-macos
          path: target/jpackage/*.dmg

  upload-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Read version from version.properties
        id: get_version
        run: |
          VERSION=$(grep "version=" ./artifacts/target/classes/version.properties | cut -d '=' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify downloaded artifacts
        run: |
            ls -lh ./artifacts/logicban-windows
            ls -lh ./artifacts/logicban-linux-deb
            ls -lh ./artifacts/logicban-macos
      # Calcular Hashes
      - name: Generate checksums
        id: checksums
        shell: bash
        run: |
          WIN_FILE="./artifacts/logicban-windows/LogicBan-${VERSION}.exe"
          LINUX_FILE="./artifacts/logicban-linux-deb/logicban_${VERSION}_amd64.deb"
          MACOS_FILE="./artifacts/logicban-macos/LogicBan-${VERSION}.dmg"
          WIN_SHA256=$(sha256sum "$WIN_FILE" | awk '{print $1}')
          LINUX_SHA256=$(sha256sum "$LINUX_FILE" | awk '{print $1}')
          MACOS_SHA256=$(sha256sum "$MACOS_FILE" | awk '{print $1}')
          echo "win_sha256=$WIN_SHA256" >> $GITHUB_OUTPUT
          echo "linux_sha256=$LINUX_SHA256" >> $GITHUB_OUTPUT
          echo "macos_sha256=$MACOS_SHA256" >> $GITHUB_OUTPUT
      - name: Verify Windows artifact
        run: |
          if [ ! -f "./artifacts/logicban-windows/LogicBan-${VERSION}.exe" ]; then
            echo "Arquivo LogicBan-${VERSION}.exe não encontrado!"
            exit 1
          fi
      - name: Verify Linux artifact
        run: |
          if [ ! -f "./artifacts/logicban-linux-deb/logicban_${VERSION}_amd64.deb" ]; then
            echo "Arquivo logicban_${VERSION}_amd64.deb não encontrado!"
            exit 1
          fi
      - name: Verify macOS artifact
        run: |
          if [ ! -f "./artifacts/logicban-macos/LogicBan-${VERSION}.dmg" ]; then
            echo "Arquivo LogicBan-${VERSION}.dmg não encontrado!"
            exit 1
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${VERSION}
          release_name: Release v${VERSION}
          draft: false
          prerelease: false
          body: |
            ## Artifact Checksums:
            * Windows SHA256: ${{ steps.checksums.outputs.win_sha256 }}
            * Linux SHA256: ${{ steps.checksums.outputs.linux_sha256 }}
            * macOS SHA256: ${{ steps.checksums.outputs.macos_sha256 }}

      - name: Upload Windows artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/logicban-windows/LogicBan-${VERSION}.exe
          asset_name: LogicBan-Windows.exe
          asset_content_type: application/octet-stream

      - name: Upload Linux artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/logicban-linux-deb/logicban_${VERSION}_amd64.deb
          asset_name: LogicBan-Linux.deb
          asset_content_type: application/octet-stream

      - name: Upload macOS artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/logicban-macos/LogicBan-${VERSION}.dmg
          asset_name: LogicBan-macOS.dmg
          asset_content_type: application/octet-stream