name: Build and Package

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Necessário para obter o histórico completo para tags

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Read Version from pom.xml
        id: project_version
        shell: pwsh
        run: |
              $VERSION = $(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
                echo "version=$VERSION" >> $env:GITHUB_OUTPUT
                echo "version_with_v=$VERSION" >> $env:GITHUB_OUTPUT # Add v for tag

      - name: Build with Maven
        run: mvn package

      - name: Package with jpackage (Windows)
        shell: pwsh
        run: |
          $version = "${{ steps.project_version.outputs.version }}"
          jpackage --type exe `
                   --input target `
                   --main-jar "LogicBan-$version-jar-with-dependencies.jar"  `
                   --main-class br.ufcat.logicban.ui.Main `
                   --dest target/jpackage `
                   --app-version $version `
                   --name LogicBan `
                   --vendor "Bug Hunters" `
                   --copyright "Copyright (C) 2025" `
                   --icon src/resources/assets/logos/icone.ico `
                   --win-menu `
                   --win-per-user-install `
                   --win-help-url "https://github.com/GustavoBorges13/LogicBan/wiki/Tutorial-%E2%80%90-Como-jogar" `
                   --win-update-url "https://github.com/GustavoBorges13/LogicBan/releases/latest"
      
      - name: Verify Windows artifact
        shell: pwsh
        run: |
            if (!(Test-Path -Path "target/jpackage/LogicBan-$version.exe")) {
                Write-Error "File 'target/jpackage/LogicBan-$version.exe' not found."
                exit 1
            }
        
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-windows
          path: target/jpackage/LogicBan-*.exe
    outputs:
      version: ${{ steps.project_version.outputs.version }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Necessário para obter o histórico completo para tags

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Read Version from pom.xml
        id: project_version
        run: |
          VERSION=$(mvn org.codehaus.mojo:exec-maven-plugin:1.6.0:exec -Dexec.executable="echo" -Dexec.args='${project.version}' -q --non-recursive)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn -q package -DincludeScope=compile
        
      - name: Clean jpackage output directory
        run: |
          rm -rf ./jpackage-output
          mkdir -p ./jpackage-output

      - name: Verify jars targets
        run: |
          ls -lh target/*.jar

      - name: Package with jpackage (Linux)
        run: |
          version="${{ steps.project_version.outputs.version }}"
          jpackage --type deb \
             --input target \
             --main-jar "LogicBan-$version-jar-with-dependencies.jar"  \
             --main-class br.ufcat.logicban.ui.Main \
             --dest ./jpackage-output \
             --app-version "$version" \
             --name LogicBan \
             --vendor "Bug Hunters" \
             --copyright "Copyright (C) 2025" \
             --icon src/resources/assets/logos/icone.png \
             --linux-menu-group "Utility;" \
             --linux-shortcut \
             --linux-app-category "Utility" \
             --linux-package-name "logicban" \
             --linux-deb-maintainer "ggustavo.borges13@exemplo.com" \
             --linux-rpm-license-type "GPLv3" 

      - name: Verify Linux artifact
        run: |
          version="${{ steps.project_version.outputs.version }}"
          if [ ! -f "./jpackage-output/logicban_${version}_amd64.deb" ]; then
            echo "Arquivo logicban_${version}_amd64.deb não encontrado!"
            exit 1
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-linux-deb
          path: ./jpackage-output/*.deb
    outputs:
      version: ${{ steps.project_version.outputs.version }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Necessário para obter o histórico completo para tags

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Read Version from pom.xml
        id: project_version
        run: |
          VERSION=$(mvn org.codehaus.mojo:exec-maven-plugin:1.6.0:exec -Dexec.executable="echo" -Dexec.args='${project.version}' -q --non-recursive)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn package

      - name: Package with jpackage (macOS)
        run: |
          version="${{ steps.project_version.outputs.version }}"
          jpackage --type dmg \
             --input target \
             --main-jar "LogicBan-$version-jar-with-dependencies.jar"  \
             --main-class br.ufcat.logicban.ui.Main \
             --dest target/jpackage \
             --app-version "$version" \
             --name LogicBan \
             --vendor "Bug Hunters" \
             --copyright "Copyright (C) 2025" \
             --icon src/resources/assets/logos/icone.ico
    
      - name: Verify macOS artifact
        run: |
          version="${{ steps.project_version.outputs.version }}"
          if [ ! -f "target/jpackage/LogicBan-$version.dmg" ]; then
            echo "Arquivo LogicBan-$version.dmg não encontrado!"
            exit 1
          fi

      - name: List jpackage Output
        run: ls -lh target/jpackage/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-macos
          path: target/jpackage/*.dmg
    outputs:
      version: ${{ steps.project_version.outputs.version }}

  upload-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permissão para criar releases e fazer upload de ativos
      actions: read    # Permissão para acessar os artefatos

    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Verify downloaded artifacts
        run: |
            ls -lh ./artifacts/logicban-windows
            ls -lh ./artifacts/logicban-linux-deb
            ls -lh ./artifacts/logicban-macos

      # Calcular Hashes
      - name: Generate checksums
        id: checksums
        shell: bash
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          WIN_FILE="./artifacts/logicban-windows/LogicBan-$VERSION.exe"
          LINUX_FILE="./artifacts/logicban-linux-deb/logicban_${VERSION}_amd64.deb"
          MACOS_FILE="./artifacts/logicban-macos/LogicBan-$VERSION.dmg"

          WIN_SHA256=$(sha256sum "$WIN_FILE" | awk '{print $1}')
          LINUX_SHA256=$(sha256sum "$LINUX_FILE" | awk '{print $1}')
          MACOS_SHA256=$(sha256sum "$MACOS_FILE" | awk '{print $1}')

          echo "win_sha256=$WIN_SHA256" >> $GITHUB_OUTPUT
          echo "linux_sha256=$LINUX_SHA256" >> $GITHUB_OUTPUT
          echo "macos_sha256=$MACOS_SHA256" >> $GITHUB_OUTPUT

      - name: Verify Windows artifact
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          if [ ! -f "./artifacts/logicban-windows/LogicBan-$VERSION.exe" ]; then
            echo "Arquivo LogicBan-$VERSION.exe não encontrado!"
            exit 1
          fi

      - name: Verify Linux artifact
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          if [ ! -f "./artifacts/logicban-linux-deb/logicban_${VERSION}_amd64.deb" ]; then
            echo "Arquivo logicban_${VERSION}_amd64.deb não encontrado!"
            exit 1
          fi

      - name: Verify macOS artifact
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          if [ ! -f "./artifacts/logicban-macos/LogicBan-$VERSION.dmg" ]; then
            echo "Arquivo LogicBan-$VERSION.dmg não encontrado!"
            exit 1
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          release_name: Release v${{ needs.build-windows.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Artifact Checksums:
            * Windows SHA256: ${{ steps.checksums.outputs.win_sha256 }}
            * Linux SHA256: ${{ steps.checksums.outputs.linux_sha256 }}
            * macOS SHA256: ${{ steps.checksums.outputs.macos_sha256 }}

      - name: Upload Windows artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/logicban-windows/LogicBan-${{ needs.build-windows.outputs.version }}.exe
          asset_name: LogicBan-Windows.exe
          asset_content_type: application/octet-stream

      - name: Upload Linux artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/logicban-linux-deb/logicban_${{ needs.build-windows.outputs.version }}_amd64.deb
          asset_name: LogicBan-Linux.deb
          asset_content_type: application/octet-stream

      - name: Upload macOS artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/logicban-macos/LogicBan-${{ needs.build-windows.outputs.version }}.dmg
          asset_name: LogicBan-macOS.dmg
          asset_content_type: application/octet-stream