name: Build Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-linux-installer:
    name: Build Installer on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 23

      - name: Build with Maven
        run: |
          mvn clean package

      - name: List target directory (debug)
        run: |
          ls -l ./target

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Package with jpackage (Linux)
        run: |
          mkdir -p ./dist
          jpackage --input ./target \
                   --main-jar logicban-1.0.0-jar-with-dependencies.jar \
                   --main-class br.ufcat.logicban.ui.Main \
                   --dest ./dist \
                   --name LogicBan \
                   --app-version 1.0.0 \
                   --vendor "Bug Hunters" \
                   --copyright "Copyright (C) 2025" \
                   --linux-package-name logicban \
                   --linux-shortcut

      - name: List dist directory (debug)
        run: |
          ls -l ./dist

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          path: ./dist/logicban_1.0.0_amd64.deb
          name: linux-installer

  build-windows-installer:
    name: Build Installer on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 23

      - name: Build with Maven
        run: |
          mvn clean package

      - name: List target directory (debug)
        shell: pwsh
        run: |
          ls ./target

      - name: Package with jpackage (Windows)
        shell: pwsh
        run: |
          jpackage --input ./target `
                   --main-jar logicban-1.0.0-jar-with-dependencies.jar `
                   --main-class br.ufcat.logicban.ui.Main `
                   --dest ./dist `
                   --name LogicBan `
                   --app-version 1.0.0 `
                   --vendor "Bug Hunters" `
                   --copyright "Copyright (C) 2025" `
                   --win-menu `
                   --win-shortcut

      - name: List dist directory (debug)
        shell: pwsh
        run: |
          ls ./dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          path: ./dist/LogicBan-1.0.0.exe
          name: windows-installer