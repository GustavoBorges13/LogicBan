name: Build and Package

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn package

      - name: Package with jpackage (Windows)
        shell: pwsh
        run: |
          jpackage --type exe `
                   --input target `
                   --main-jar logicban-1.0.0.jar `
                   --main-class br.ufcat.logicban.ui.Main `
                   --dest target/jpackage `
                   --app-version 1.0.0 `
                   --name LogicBan `
                   --vendor "Bug Hunters" `
                   --copyright "Copyright (C) 2025" `
                   --icon src/resources/assets/logos/icone.ico `
                   --win-menu `
                   --win-per-user-install `
                   --win-help-url "https://github.com/GustavoBorges13/LogicBan/wiki/Tutorial-%E2%80%90-Como-jogar" `
                   --win-update-url "https://github.com/GustavoBorges13/LogicBan/releases/latest"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-windows
          path: target/jpackage/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn package

      - name: Package with jpackage (Linux)
        run: |
          jpackage --type deb \
                   --input target \
                   --main-jar logicban-1.0.0.jar \
                   --main-class br.ufcat.logicban.ui.Main \
                   --dest ./jpackage-output \
                   --app-version 1.0.0 \
                   --name LogicBan \
                   --vendor "Bug Hunters" \
                   --copyright "Copyright (C) 2025" \
                   --icon src/resources/assets/logos/icone.png

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-linux-deb
          path: ./jpackage-output/*.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn package

      - name: Package with jpackage (macOS)
        run: |
          jpackage --type dmg \
                   --input target \
                   --main-jar logicban-1.0.0.jar \
                   --main-class br.ufcat.logicban.ui.Main \
                   --dest target/jpackage \
                   --app-version 1.0.0 \
                   --name LogicBan \
                   --vendor "Bug Hunters" \
                   --copyright "Copyright (C) 2025" \
                   --icon src/resources/assets/logos/icone.ico
    
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-macos
          path: target/jpackage/*.dmg

  upload-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permissão para criar releases e fazer upload de ativos
      actions: read    # Permissão para acessar os artefatos

    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Verify downloaded artifacts
        run: |
          ls -lh ./artifacts/logicban-windows/target/jpackage/
          ls -lh ./artifacts/logicban-linux-deb/
          ls -lh ./artifacts/logicban-macos/target/jpackage/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Windows artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/logicban-windows/target/jpackage/*.exe
          asset_name: LogicBan-Windows.exe
          asset_content_type: application/octet-stream

      - name: Upload Linux artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/logicban-linux-deb/*.deb
          asset_name: LogicBan-Linux.deb
          asset_content_type: application/octet-stream

      - name: Upload macOS artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/logicban-macos/target/jpackage/*.dmg
          asset_name: LogicBan-macOS.dmg
          asset_content_type: application/octet-stream