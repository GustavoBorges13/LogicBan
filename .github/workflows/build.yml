name: Build and Package

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package

      - name: Package with jpackage (Windows)
        run: |
          jpackage --type exe --input target --main-jar logicban-1.0.0.jar --main-class br.ufcat.logicban.ui.Main --dest target/jpackage --app-version 1.0.0 --name LogicBan --vendor "Bug Hunters" --copyright "Copyright (C) 2025" --icon src/resources/assets/logos/icone.ico --win-menu --win-shortcut --win-per-user-install --win-update-url "https://github.com/GustavoBorges13/LogicBan" --win-help-url "https://github.com/GustavoBorges13/LogicBan" --win-update-url "https://github.com/GustavoBorges13/LogicBan"


      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-windows
          path: target/jpackage/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package

      - name: Package with jpackage (Linux)
        run: |
          jpackage --type deb \
                   --input target \
                   --main-jar logicban-1.0.0.jar \
                   --main-class br.ufcat.logicban.ui.Main \
                   --dest target/jpackage \
                   --app-version 1.0.0 \
                   --name LogicBan \
                   --vendor "Bug Hunters" \
                   --copyright "Copyright (C) 2025" \
                   --icon src/resources/assets/logos/icone.ico

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-linux
          path: target/jpackage/*.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package

      - name: Package with jpackage (macOS)
        run: |
          jpackage --type dmg \
                   --input target \
                   --main-jar logicban-1.0.0.jar \
                   --main-class br.ufcat.logicban.ui.Main \
                   --dest target/jpackage \
                   --app-version 1.0.0 \
                   --name LogicBan \
                   --vendor "Bug Hunters" \
                   --copyright "Copyright (C) 2025" \
                   --icon src/resources/assets/logos/icone.ico

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: logicban-macos
          path: target/jpackage/*.dmg